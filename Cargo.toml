[workspace]
members = ["programs/*"]
resolver = "2"

# Keep the lockfile buildable inside solana-verify's 1.75 Docker image.
[workspace.package]
rust-version = "1.75"

[profile.release]
# Optimise for size: program rent on Solana scales with the binary's byte length.
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
